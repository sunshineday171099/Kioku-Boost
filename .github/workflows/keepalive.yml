name: keepalive

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://ujwlgqqglpvijrhafluf.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_EdcCEB15f3wyhSg-y4GB5w_QSOVe06C" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Jaga repository tetap aktif
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((45 * 86400)) ]; then
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: jaga repository tetap aktif"
            git push
          fi
